<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="body">
        <div class="title">Tic&nbsp Tac &nbspToe</div>
        <div class="container">
            <div class=" box2">X</div>
            <div class=" box1">X</div>
            <div class=" box3">X</div>
            <div class=" box4">X</div>
            <div class=" box5">X</div>
            <div class=" box6">X</div>
            <div class=" box7">X</div>
            <div class=" box8">X</div>
            <div class=" box9">X</div>
        </div>

        <div class="lightbox">
            <div>
                <div class="green"></div>
                <div onclick="window.location.reload();" class="new_game">New Game</div>
                <div class="red"></div>
            </div>

            <div class="name"></div>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
